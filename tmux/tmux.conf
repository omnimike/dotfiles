
unbind C-b
set -g prefix M-a
bind-key M-a send-prefix

set -g mouse on

set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"
set -sg escape-time 10 
set -g history-limit 65536
set -g base-index 1
set -g focus-events on
set -s set-clipboard on
set -g allow-passthrough all

set-option -g set-titles on

set-window-option -g mode-keys vi
set -g status-keys vi

# set-option -g status-position top

bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
bind ] paste-buffer -p

set -g mode-style "fg=default,bg=default,reverse"

if-shell "[[ -f ~/.tmux-local.conf ]]" "source-file ~/.tmux-local.conf"


# A poor man's plugin manager. We don't want to use tpm because we want to use
# this in environments which can't connect to the internet.

# set -g @plugins "$HOME/.dotfiles/tmux/plugins/tmux-which-key/plugin.sh.tmux"

run-shell 'plugins=$(tmux show-option -gqv @plugins); for plugin in $plugins; do [ -f "$plugin" ] && tmux run-shell "$plugin"; done'
